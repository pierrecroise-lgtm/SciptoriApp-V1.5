<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ScriptoriApp — Guilde des Notes</title>
<link rel="stylesheet" href="style.css">
<style>
  /* ============================================================
     Styles PROPRES à la page Notes uniquement.
     (pas de topbar sur cette page)
  ============================================================ */

  .notes-page{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    padding:18px 14px 40px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .notes-header{
    display:flex;
    flex-direction:column;
    gap:4px;
    margin-bottom:2px;
  }
  .notes-header h1{
    font-family:var(--font-display);
    font-size:.85rem;
    color:var(--gold-bright);
    text-shadow:0 2px 0 rgba(0,0,0,.6);
    margin:0;
  }
  .notes-header p{
    margin:0;
    font-size:.95rem;
    color:var(--parchment-300);
    opacity:.75;
  }

  /* --- Barre d'outils : Trier par / Recherche --- */
  .notes-toolbar{
    display:flex;
    gap:10px;
    position:relative;
    z-index:20;
  }
  .toolbar-item{ position:relative; flex:1; }
  .notes-toolbar .btn-parchment{
    width:100%;
    justify-content:center;
  }

  .dropdown-menu{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background:linear-gradient(180deg,var(--parchment-100),var(--parchment-300));
    border:2px solid var(--oak-700);
    border-radius:var(--radius-sm);
    box-shadow:var(--shadow-deep);
    overflow:hidden;
  }
  .dropdown-menu li button{
    width:100%;
    text-align:left;
    padding:.65em .8em;
    font-family:var(--font-body);
    font-size:1rem;
    color:var(--parchment-ink);
    border-bottom:1px solid rgba(90,60,20,.2);
  }
  .dropdown-menu li:last-child button{ border-bottom:none; }
  .dropdown-menu li button:hover{ background:rgba(201,162,39,.25); }
  .dropdown-menu li button.is-selected{
    color:var(--seal);
    font-weight:700;
  }

  .search-box{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    display:flex;
    gap:6px;
  }
  .search-box input{
    flex:1;
    padding:.6em .7em;
    border:2px solid var(--oak-700);
    border-radius:var(--radius-sm);
    background:var(--parchment-100);
    color:var(--parchment-ink);
    font-size:1rem;
    outline:none;
  }
  .search-box input:focus{
    box-shadow:0 0 0 2px var(--gold);
  }

  /* --- Liste des ouvrages --- */
  .book-list{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .book-empty{
    text-align:center;
    padding:30px 10px;
    color:var(--parchment-300);
    font-style:italic;
    opacity:.7;
  }

  .book-item{
    border-radius:var(--radius-md);
    overflow:hidden;
  }

  .book-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    width:100%;
    text-align:left;
    background:transparent;
  }
  .book-row:hover{ background:rgba(255,255,255,.08); }

  .book-icon{
    width:38px;
    height:38px;
    flex:0 0 auto;
    image-rendering:pixelated;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.5));
    transition:transform .15s ease;
  }
  .book-item.is-open .book-icon{ transform:rotate(-8deg) scale(1.05); }

  .book-meta{
    flex:1;
    min-width:0;
  }
  .book-title{
    font-weight:700;
    font-size:1.12rem;
    color:var(--parchment-ink);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .book-author{
    font-size:.95rem;
    font-style:italic;
    color:var(--parchment-ink);
    opacity:.65;
  }

  .book-chevron{
    flex:0 0 auto;
    font-family:var(--font-display);
    font-size:.6rem;
    color:var(--oak-700);
    transition:transform .2s ease;
  }
  .book-item.is-open .book-chevron{ transform:rotate(90deg); }

  /* --- Détail déroulant --- */
  .book-detail{
    max-height:0;
    overflow:hidden;
    transition:max-height .28s ease;
    background:rgba(27,18,10,.06);
    border-top:1px dashed var(--oak-600);
  }
  .book-item.is-open .book-detail{
    max-height:260px;
  }

  .detail-inner{
    padding:12px 14px 16px;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px 14px;
  }

  .detail-stat{
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .detail-stat .label{
    font-family:var(--font-display);
    font-size:.5rem;
    color:var(--oak-700);
    letter-spacing:.02em;
  }
  .detail-stat .value{
    font-size:1.05rem;
    font-weight:600;
    color:var(--parchment-ink);
  }

  .detail-note{
    grid-column:span 2;
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:2px;
  }
  .detail-note .label{
    font-family:var(--font-display);
    font-size:.5rem;
    color:var(--oak-700);
  }

  .btn-accesnotes{
    grid-column:span 2;
    margin-top:6px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.5em;
    padding:.7em 1em;
    background:linear-gradient(180deg,var(--seal),var(--seal-dark));
    border:2px solid var(--oak-950);
    border-radius:var(--radius-sm);
    color:var(--gold-bright);
    font-family:var(--font-display);
    font-size:.62rem;
    box-shadow:var(--shadow-soft), inset 0 0 0 1px rgba(255,255,255,.15);
    transition:transform .12s ease, filter .12s ease;
  }
  .btn-accesnotes:hover{ filter:brightness(1.12); transform:translateY(-1px); }
  .btn-accesnotes:active{ transform:translateY(0); filter:brightness(.95); }

  @media (max-width:380px){
    .detail-inner{ grid-template-columns:1fr; }
    .detail-note, .btn-accesnotes{ grid-column:span 1; }
  }
</style>
</head>
<body class="page-notes">

<main class="notes-page">

  <div class="notes-header">
    <h1>Guilde des Notes</h1>
    <p>Les ouvrages achevés et les chroniques qui s'y rattachent.</p>
  </div>

  <div class="notes-toolbar">
    <div class="toolbar-item">
      <button id="sortBtn" class="btn-parchment" aria-expanded="false">Trier par ▾</button>
      <ul id="sortMenu" class="dropdown-menu hidden">
        <li><button data-sort="recent" class="is-selected">Terminé récemment</button></li>
        <li><button data-sort="title">Titre (A → Z)</button></li>
        <li><button data-sort="author">Auteur (A → Z)</button></li>
        <li><button data-sort="rating">Meilleure note</button></li>
      </ul>
    </div>
    <div class="toolbar-item">
      <button id="searchBtn" class="btn-parchment" aria-expanded="false">🔍 Recherche</button>
      <div id="searchBox" class="search-box hidden">
        <input id="searchInput" type="text" placeholder="Titre ou auteur…" autocomplete="off">
      </div>
    </div>
  </div>

  <ul id="bookList" class="book-list"></ul>

</main>

  /* ---------------------------------------------------------
     Données d'exemple — à remplacer par Firestore par la suite.
     dateDebut / dateFin au format ISO (YYYY-MM-DD).
  --------------------------------------------------------- */
  const books = [
    {
      id:1, titre:"Bilbo le Hobbit", auteur:"J.R.R. Tolkien",
      genre:"Fantasy", pages:310,
      dateDebut:"2026-03-02", dateFin:"2026-03-14",
      note:8
    },
    {
      id:2, titre:"Dune", auteur:"Frank Herbert",
      genre:"Science-fiction", pages:592,
      dateDebut:"2026-04-01", dateFin:"2026-04-22",
      note:9
    },
    {
      id:3, titre:"Le Nom de la Rose", auteur:"Umberto Eco",
      genre:"Roman historique", pages:640,
      dateDebut:"2026-05-03", dateFin:"2026-06-01",
      note:7
    },
    {
      id:4, titre:"L'Odyssée", auteur:"Homère",
      genre:"Classique", pages:420,
      dateDebut:"2026-06-10", dateFin:"2026-07-20",
      note:6
    },
    {
      id:5, titre:"La Cité des Nuages", auteur:"Elara Vinh",
      genre:"Fantasy", pages:388,
      dateDebut:"2026-07-01", dateFin:"2026-07-15",
      note:9
    },
    {
      id:6, titre:"Chroniques du Fleuve Gris", auteur:"Owen Marchetti",
      genre:"Aventure", pages:276,
      dateDebut:"2026-07-18", dateFin:"2026-07-29",
      note:5
    }
  ];

  let currentSort = "recent";
  let currentQuery = "";
  let openId = null;

  const bookListEl = document.getElementById("bookList");
  const sortBtn = document.getElementById("sortBtn");
  const sortMenu = document.getElementById("sortMenu");
  const searchBtn = document.getElementById("searchBtn");
  const searchBox = document.getElementById("searchBox");
  const searchInput = document.getElementById("searchInput");

  function joursEntre(d1, d2){
    const ms = new Date(d2) - new Date(d1);
    return Math.max(1, Math.round(ms / 86400000) + 1);
  }

  function formatDate(d){
    const parts = d.split("-");
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }

  function sortBooks(list){
    const sorted = [...list];
    switch(currentSort){
      case "title":
        sorted.sort((a,b)=>a.titre.localeCompare(b.titre,'fr'));
        break;
      case "author":
        sorted.sort((a,b)=>a.auteur.localeCompare(b.auteur,'fr'));
        break;
      case "rating":
        sorted.sort((a,b)=>b.note - a.note);
        break;
      case "recent":
      default:
        sorted.sort((a,b)=> new Date(b.dateFin) - new Date(a.dateFin));
        break;
    }
    return sorted;
  }

  function filterBooks(list){
    const q = currentQuery.trim().toLowerCase();
    if(!q) return list;
    return list.filter(b =>
      b.titre.toLowerCase().includes(q) ||
      b.auteur.toLowerCase().includes(q)
    );
  }

  function render(){
    const visible = sortBooks(filterBooks(books));

    if(visible.length === 0){
      bookListEl.innerHTML = '<li class="book-empty">Aucun ouvrage ne correspond à ta recherche.</li>';
      return;
    }

    bookListEl.innerHTML = visible.map(b => {
      const isOpen = b.id === openId;
      return `
        <li class="book-item panel-parchment ${isOpen ? 'is-open' : ''}" data-id="${b.id}">
          <button class="book-row" data-toggle="${b.id}">
            <img class="book-icon" src="${PARCHMENT_ICON}" alt="">
            <span class="book-meta">
              <span class="book-title">${b.titre}</span><br>
              <span class="book-author">${b.auteur}</span>
            </span>
            <span class="book-chevron">▶</span>
          </button>
          <div class="book-detail">
            <div class="detail-inner">
              <div class="detail-stat">
                <span class="label">GENRE</span>
                <span class="value">${b.genre}</span>
              </div>
              <div class="detail-stat">
                <span class="label">PAGES</span>
                <span class="value">${b.pages}</span>
              </div>
              <div class="detail-stat">
                <span class="label">DURÉE DE LECTURE</span>
                <span class="value">${joursEntre(b.dateDebut,b.dateFin)} jours</span>
              </div>
              <div class="detail-stat">
                <span class="label">PÉRIODE</span>
                <span class="value" style="font-size:.85rem;">${formatDate(b.dateDebut)} → ${formatDate(b.dateFin)}</span>
              </div>
              <div class="detail-note">
                <span class="label">NOTE</span>
                <span class="seal-badge">${b.note}/10</span>
              </div>
              <button class="btn-accesnotes" data-notes="${b.id}">📜 Lire mes notes</button>
            </div>
          </div>
        </li>
      `;
    }).join("");
  }

  /* --- Toggle "Trier par" --- */
  sortBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    searchBox.classList.add("hidden");
    searchBtn.classList.remove("is-active");
    searchBtn.setAttribute("aria-expanded","false");
    const willOpen = sortMenu.classList.contains("hidden");
    sortMenu.classList.toggle("hidden");
    sortBtn.classList.toggle("is-active", willOpen);
    sortBtn.setAttribute("aria-expanded", String(willOpen));
  });

  sortMenu.addEventListener("click", (e)=>{
    const btn = e.target.closest("button[data-sort]");
    if(!btn) return;
    currentSort = btn.dataset.sort;
    sortMenu.querySelectorAll("button").forEach(b=>b.classList.toggle("is-selected", b===btn));
    sortMenu.classList.add("hidden");
    sortBtn.classList.remove("is-active");
    render();
  });

  /* --- Toggle "Recherche" --- */
  searchBtn.addEventListener("click", (e)=>{
    e.stopPropagation();
    sortMenu.classList.add("hidden");
    sortBtn.classList.remove("is-active");
    const willOpen = searchBox.classList.contains("hidden");
    searchBox.classList.toggle("hidden");
    searchBtn.classList.toggle("is-active", willOpen);
    searchBtn.setAttribute("aria-expanded", String(willOpen));
    if(willOpen) searchInput.focus();
  });

  searchInput.addEventListener("input", (e)=>{
    currentQuery = e.target.value;
    render();
  });

  document.addEventListener("click", ()=>{
    sortMenu.classList.add("hidden");
    sortBtn.classList.remove("is-active");
    searchBox.classList.add("hidden");
    searchBtn.classList.remove("is-active");
  });

  /* --- Ouverture / fermeture d'un ouvrage --- */
  bookListEl.addEventListener("click", (e)=>{
    const notesBtn = e.target.closest("button[data-notes]");
    if(notesBtn){
      e.stopPropagation();
      // TODO : renvoyer vers les notes prises dans la rubrique "En cours"
      // une fois cette rubrique reliée (Firestore / navigation interne).
      console.log("Ouvrir les notes du livre", notesBtn.dataset.notes);
      return;
    }
    const toggleBtn = e.target.closest("button[data-toggle]");
    if(!toggleBtn) return;
    const id = Number(toggleBtn.dataset.toggle);
    openId = (openId === id) ? null : id;
    render();
  });

  render();
})();
</script>
